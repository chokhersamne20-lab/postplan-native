name: postplan_native
description: PostPlan — ফেসবুক পোস্ট শিডিউলার (নেটিভ, Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2          # স্টেট ম্যানেজমেন্ট
  http: ^1.2.0              # Apps Script API কল
  shared_preferences: ^2.3.4 # লোকাল ক্যাশ/প্রিফারেন্স
  intl: ^0.19.0
  timezone: ^0.9.4         # অ্যালার্মের নির্দিষ্ট সময় (zonedSchedule)
  table_calendar: ^3.1.2    # ক্যালেন্ডার ভিউ
  fl_chart: ^0.69.2         # মাসিক অ্যানালিটিক্স গ্রাফ
  flutter_local_notifications: ^17.2.3 # অ্যালার্ম/নোটিফিকেশন
  flutter_tts: ^4.2.0       # বাংলা ভয়েস ঘোষণা
  torch_light: ^1.1.0       # 🔦 ফ্ল্যাশলাইট
  vibration: ^3.1.3         # 📳 ভাইব্রেশন (HapticFeedback-এর বাইরে)
  lottie: ^3.3.0            # Welcome অ্যানিমেশন
  confetti: ^0.8.0          # 🎉 টার্গেট পূরণ
  share_plus: ^10.1.3       # CSV এক্সপোর্ট/শেয়ার
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
